# The reference pages: quartodoc writes them from the docstrings (python tools/docs.py generate).
quartodoc:
  package: functai
  dir: ../docs/reference
  title: Reference
  style: pkgdown
  parser: numpy
  sections:
  - title: Writing AI functions
    desc: A typed function becomes a model call. The parts of the function are the
      parts of the prompt.
    contents:
    - ai
    - name: _ai
      dynamic: false
    - module
    - FunctAIFunc
    - Prediction
    - JSON
  - title: Models and settings
    desc: Which model answers, how it is reached, and every other setting.
    contents:
    - configure
    - login
    - logins
    - logout
    - login_methods
  - title: Prompt layouts
    desc: How each value is written into the prompt and read back. The default needs
      nothing; these write the conversation yourself.
    contents:
    - package: lmcc.adapter
      name: system
    - package: lmcc.adapter
      name: user
    - package: lmcc.adapter
      name: assistant
    - package: lmcc.adapter
      name: developer
    - turns
  - title: Evaluation
    desc: Run a program on rows with known answers and score it, with an honest interval.
    contents:
    - evaluate
    - Evaluation
    - compare
    - runs
    - exact_match
  - title: Optimizers
    desc: Improve the instruction and the worked examples a function sends. Each returns an
      improved copy; the function is unchanged. The classes are for `fn.opt(rows, optimizer=...)`.
    contents:
    - labeled_few_shot
    - bootstrap_few_shot
    - gepa
    - LabeledFewShot
    - BootstrapFewShot
    - BootstrapFewShotWithRandomSearch
    - InstructionSearch
    - GEPA
    - Optimizer
    - ProgramState
  - title: Saving and shipping
    desc: Find everything a program depends on, save it to a folder, prove it runs
      elsewhere, load it back.
    contents:
    - check
    - Report
    - Problem
    - save
    - verify
    - Verification
    - load
    - describe
    - file
  - title: Streaming
    desc: Watch a call while it is made. `fn.stream(...)` returns a Stream; its events
      are in `functai.streaming`.
    contents:
    - Stream
    - Cancelled
  - title: Observers and journals
    desc: Every event of every call tree, given to your code as it happens, or kept in a
      store while the call runs; read back and followed live.
    contents:
    - Journal
    - MemoryStore
    - Store
    - Follower
    - flush
    - Outcome
  - title: Conversations
    desc: A program's calls that remember each other, kept in a store; branches, what the
      model sees, and helpers' memory inside a module.
    contents:
    - conversations.Conversation
    - conversations.Turn
    - last_turns
    - all_turns
    - remember
    - earlier
    - FolderStore
    - MemoryConversations
    - Waiting
    - ConversationError
  - title: Plugins
    desc: Hooks over turns, context, calls, requests and tools; every change is data and recorded.
      Approval, compaction and delegation are plugins too.
    contents:
    - Plugin
    - Change
    - PluginError
    - load_plugin
    - compaction
    - delegate
  - title: Tools that ask first
    desc: Tools say what they do to the world; a person can be asked before they run.
    contents:
    - tool
    - Tool
    - Approval
    - ApprovalError
  - title: Serving
    desc: Serve a program over HTTP to callers who see only its boundary; use a served
      program like a local one (`remote`'s page also has `RemoteProgram` and `RemoteError`).
    contents:
    - serve
    - Service
    - remote
    - ServeError
  - title: The call log
    desc: Keep every call on disk, mark answers right or wrong, and turn the corrections
      into rows with known answers.
    contents:
    - calls
    - rate
    - rated
    - split
    - prune_calls
  - title: Long runs
    desc: Replies kept on disk, and a check on a judge's evidence. See also `fn.map` (a
      progress line, and resuming by running again) and `prune_calls`.
    contents:
    - quotes_found
    - clear_cache
  - title: Baking into weights
    desc: Train a small model that answers an AI function, then run the same function
      on it.
    contents:
    - bake.bake
    - bake.examples
    - bake.plan
    - name: bake.Plan
      dynamic: true
    - name: bake.Examples
      dynamic: true
    - bake.adopt
    - bake.judge
    - bake.runs
    - bake.run
    - name: bake.Run
      dynamic: true
    - bake.Baked
    - bake.BakeReport
    - bake.load
    - bake.is_baked
    - bake.BakeError
  - title: Datasets
    desc: Small labelled tables to learn with. Every example on this site runs on
      them.
    contents:
    - datasets.tickets
    - datasets.refunds
    - datasets.field_notes
  - title: Inspection
    desc: See exactly what was sent and what came back.
    contents:
    - phistory
    - inspect_history
    - signature_text
  - title: Errors
    desc: What functai raises, and what each one tells you to do.
    contents:
    - FunctAIError
    - InterfaceError
    - LoginRequired
    - StepLimit
    - LogContentError
    - SawError
    - JournalError
    - EventRefused
    - Refused
    - LoadRefused
  - title: Low-level helpers
    desc: The pieces `@ai` uses to read a function. You rarely need them directly.
    contents:
    - flexiclass
    - docments
    - docstring
    - parse_docstring
    - compute_signature
