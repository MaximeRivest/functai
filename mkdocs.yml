# The documentation website: docs/*.md (MRMD notebooks, outputs already in
# them) → site/, with Zensical (`python tools/docs.py site`). Nothing runs here.
# Each language's own manual is built beside it and linked from its tab:
# site/ts/api/ (TypeDoc), site/r/manual/ (pkgdown), site/julia/manual/
# (Documenter); .github/workflows/docs.yml assembles them.
site_name: functai
site_description: Write a function's signature and one sentence saying what it does. A language model writes the body. You measure how well. In Python, TypeScript, R and Julia.
site_url: https://maximerivest.github.io/functai/
repo_url: https://github.com/maximerivest/functai
repo_name: maximerivest/functai
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/functai.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Python:
      - python.md
      - Get started: get-started.md
      - Learn:
          - articles/index.md
          - Start from what you have:
              - A table of text: get-started.md
              - articles/notes-to-data.md
              - articles/from-a-prompt.md
              - articles/coming-from.md
          - Is it good?:
              - articles/accuracy.md
              - articles/improving.md
              - articles/cheaper.md
              - articles/tables.md
          - Ship:
              - articles/saving.md
              - articles/baking.md
              - articles/call-log.md
          - Toolbox:
              - articles/anatomy.md
              - articles/types.md
              - articles/outputs.md
              - articles/streaming.md
              - articles/tools.md
              - articles/memory.md
              - articles/plugins.md
              - articles/modules.md
              - articles/layouts.md
              - articles/models.md
              - articles/logins.md
          - When things go wrong:
              - articles/inspection.md
              - articles/reliability.md
              - articles/upgrading.md
      - Tutorials:
          - tutorials/index.md
          - tutorials/01-first-function.md
          - tutorials/02-types.md
          - tutorials/03-is-it-right.md
          - tutorials/04-making-it-better.md
          - tutorials/05-choosing-a-model.md
          - tutorials/06-decisions.md
          - tutorials/07-a-model-you-own.md
          - tutorials/08-living-with-it.md
      - Examples: examples/index.md
      - Reference: reference/index.md
      - News: news.md
  - TypeScript:
      - ts/index.md
      - API reference: ts/api/index.html
      - News: ts/news.md
  - R:
      - r/index.md
      - Tutorials:
          - r/01-first-function.md
          - r/02-types.md
          - r/03-is-it-right.md
          - r/04-making-it-better.md
          - r/05-choosing-a-model.md
          - r/06-decisions.md
          - r/07-tidymodels.md
          - r/08-living-with-it.md
      - Manual (pkgdown): r/manual/index.html
      - News: r/news.md
  - Julia:
      - julia/index.md
      - Tutorials:
          - julia/01-first-function.md
          - julia/02-types.md
          - julia/03-is-it-right.md
          - julia/04-making-it-better.md
          - julia/05-choosing-a-model.md
          - julia/06-decisions.md
          - julia/07-mlj-and-formulas.md
          - julia/08-living-with-it.md
      - Manual (Documenter): julia/manual/index.html
      - News: julia/news.md
