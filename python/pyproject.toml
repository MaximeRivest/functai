[project]
name = "functai"
version = "1.2.0"
description = "Typed Python functions whose body is a language model call: the function is the prompt, the body is the program"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Maxime Rivest", email = "maxime.rivest@gmail.com" }
]
keywords = [
    "ai",
    "llm",
    "decorators",
    "prompt-engineering",
    "prompt-optimization",
    "structured-output",
    "function-decorators",
    "lmcc",
    "lm15",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# lmcc lays out each call and reads each reply; lm15 talks to the providers.
# lmcc ships lmcc_std (tools, reasoning, json) and lmcc_lm15 (the lm15 bridge).
dependencies = [
    "lmcc>=0.8.8,<0.9",
    "lm15>=2.2,<3",                # 2.2: Claude sends its thinking when a summary is asked (reasoning outputs)
]

[project.scripts]
functai = "functai.__main__:main"

[project.urls]
"Homepage" = "https://github.com/maximerivest/functai"
"Bug Tracker" = "https://github.com/maximerivest/functai/issues"
"Documentation" = "https://maximerivest.github.io/functai/python.html"
"Changelog" = "https://maximerivest.github.io/functai/news.html"
"Source" = "https://github.com/maximerivest/functai"

[project.optional-dependencies]
# tables: evaluation results, fn.map(), reading datasets from files and dataframes
# (1.12: unnest, which the skill and the docs use for lists of records)
data = [
    "dpyr>=1.12",
]
# files as inputs: an Attachments result (PDF, Word, Excel, slides, web pages,
# folders, pictures) as an AI function's input, its text and page images sent
# page by page (functai/files.py). 1.0.0b2 (on PyPI since 2026-10-09) is the
# first published version with the wire form and parts this needs; pip takes
# the beta because the requirement names a pre-release.
files = [
    "attachments>=1.0.0b2",
]
# baking functions into weights you own: training here (TRL, PEFT, Accelerate),
# running and serving the trained models. TRL is pinned to the minor version
# bake was tested with: its trainer's options move between minor versions.
bake = [
    "torch>=2.4",
    "transformers>=4.57",
    "safetensors>=0.4",
    "peft>=0.17",
    "accelerate>=1.4",
    "datasets>=4.7",
    "trl>=1.14,<1.15",
    "bitsandbytes>=0.45; sys_platform != 'darwin'",
]
# training and running on Tinker (Thinking Machines): its SDK and a tokenizer,
# no PyTorch, so a laptop without a GPU can bake through it
tinker = [
    "tinker>=0.39,<0.40",
    "transformers>=4.57",
    "pyarrow>=15",
]
# kernels that make training here faster: packed examples with flash attention
# (a hub kernel, nothing to compile), linear-attention layers (Qwen3.5) and
# Liger's fused losses. CUDA only; bake works without them, slower.
fast = [
    "kernels>=0.16,<0.17; sys_platform == 'linux'",
    "flash-linear-attention>=0.4; sys_platform == 'linux'",
    "liger-kernel>=0.6; sys_platform == 'linux'",
]
# reinforcement learning and distillation on Prime Intellect (functai_verifiers,
# functai_rows): verifiers' v1 API, which changes between its dev releases, so
# the exact tested one (0.3.2.dev136 = commit 1863cfbd)
prime = [
    "verifiers==0.3.2.dev136",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Development runs on lmcc's and attachments' checkouts beside this repository
# (../../lmcc, as ts/ does; ../../attachments). A built wheel ignores this
# table: it requires lmcc>=0.8.7 from PyPI (a reply the provider stopped
# refuses parse-filtered; a type's JSON form on its binding; lm15's media
# parts as types; lists of pictures sent as pictures, D-64: on PyPI since
# 2026-10-09), and attachments>=1.0.0b2 with the `files` extra.
[tool.uv.sources]
lmcc = { path = "../../lmcc/python", editable = true }
attachments = { path = "../../attachments", editable = true }

[tool.hatch.build]
packages = ["functai", "functai_verifiers", "functai_rows"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pydantic>=2",
    "dpyr>=1.12",
    "jsonschema>=4.18",     # the call log's records against contract/schema
    "basedpyright>=1.40.1",
    "attachments>=1.0.0b2",  # tests/test_files.py: files as inputs
]
# the documentation (../docs/): Markdown notebooks run on rat (../tools/docs.py run),
# the reference written from the docstrings by quartodoc, the site built by Zensical
docs = [
    "pydantic>=2",
    "dpyr>=1.12",
    "pandas>=2",
    "pyyaml>=6",
    "quartodoc>=0.11",
    "griffe>=1,<2",   # quartodoc 0.11 breaks on griffe 2
    "zensical==0.0.65",
    "ipython>=8",     # rat notebooks: the kernel and its completion (rat ensure adds them too)
    "jedi>=0.19",
    "matplotlib>=3.9",   # the tutorials' plots
    "scikit-learn>=1.5", # the tutorials' decision tree and classical baselines
]
