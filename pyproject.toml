[project]
name = "functai"
version = "1.0.0"
description = "Typed Python functions whose body is a language model call: the function is the prompt, the body is the program"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Maxime Rivest", email = "maxime.rivest@gmail.com" }
]
keywords = [
    "ai",
    "llm",
    "decorators",
    "prompt-engineering",
    "prompt-optimization",
    "structured-output",
    "function-decorators",
    "lmcc",
    "lm15",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# lmcc lays out each call and reads each reply; lm15 talks to the providers.
# lmcc ships lmcc_std (tools, reasoning, json) and lmcc_lm15 (the lm15 bridge).
dependencies = [
    "lmcc>=0.8.3,<0.9",
    "lm15>=1.0.1,<2",
]

[project.urls]
"Homepage" = "https://github.com/maximerivest/functai"
"Bug Tracker" = "https://github.com/maximerivest/functai/issues"
"Documentation" = "https://github.com/maximerivest/functai#readme"
"Source" = "https://github.com/maximerivest/functai"

[project.optional-dependencies]
# tables: evaluation results, fn.map(), reading datasets from files and dataframes
data = [
    "dpyr>=1.10",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["functai"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pydantic>=2",
    "dpyr>=1.10",
]
