# The documentation website: docs/*.md → site/ with Zensical, on GitHub Pages.
#
# Nothing runs here and no model is called: the pages are notebooks whose
# outputs are already in them (written by `python tools/docs.py run`, with
# keys, on a developer's machine, or by pressing Run in Chattering).
name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx zensical==0.0.65 build --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
